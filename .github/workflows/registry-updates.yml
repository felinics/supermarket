name: Check Registry updates

on:
  schedule:
    # Change this cron to adjust how often upstream sources are checked.
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      registry:
        description: Optional Registry ID to check
        required: false
        type: string

concurrency:
  group: registry-updates
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.updates.outputs.changed }}
      matrix: ${{ steps.updates.outputs.matrix }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - id: updates
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          if [[ -n "$REGISTRY" ]]; then
            bun run registry:updates -- --check-registry "$REGISTRY"
          else
            bun run registry:updates
          fi

  propose:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    permissions:
      actions: write
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build approved and candidate releases
        env:
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
          FULL_REPORT_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          bun run registry:updates -- \
            --registry "$REGISTRY" \
            --candidate "$CANDIDATE_REVISION" \
            --report "$RUNNER_TEMP/registry-update.md" \
            --full-report "$RUNNER_TEMP/registry-update-full.md" \
            --full-report-url "$FULL_REPORT_URL"
          cat "$RUNNER_TEMP/registry-update.md" >> "$GITHUB_STEP_SUMMARY"
      - id: candidate
        name: Create or update candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
        run: |
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "registries/$REGISTRY/registry.yaml" \
            "registries/$REGISTRY/release.lock.json"
          if ! git diff --quiet; then
            echo "Registry update generated unexpected unstaged changes" >&2
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Registry update produced no candidate changes" >&2
            exit 1
          fi
          base_sha="$(git rev-parse HEAD)"
          candidate_tree="$(git write-tree)"
          branch_prefix="automation/registry-update/$REGISTRY/"
          candidate_title="chore(registry): review $REGISTRY ${CANDIDATE_REVISION:0:12}"

          mapfile -t open_candidates < <(
            gh pr list --base main --state open --limit 100 \
              --json number,headRefName,headRepositoryOwner,isCrossRepository |
              jq -r --arg prefix "$branch_prefix" --arg owner "$GITHUB_REPOSITORY_OWNER" '
                .[]
                | select(.isCrossRepository == false)
                | select(((.headRepositoryOwner.login // "") | ascii_downcase) == ($owner | ascii_downcase))
                | select(.headRefName | startswith($prefix))
                | "\(.number)\t\(.headRefName)"
              '
          )
          if (( ${#open_candidates[@]} > 1 )); then
            echo "Multiple open candidate PRs exist for $REGISTRY; close all but one before retrying" >&2
            printf '%s\n' "${open_candidates[@]}" >&2
            exit 1
          fi

          existing_number=""
          if (( ${#open_candidates[@]} == 1 )); then
            IFS=$'\t' read -r existing_number branch <<< "${open_candidates[0]}"
          else
            previous_number="$(
              gh pr list --base main --state all --limit 100 \
                --json number,state,title,headRefName,headRepositoryOwner,isCrossRepository |
                jq -r --arg prefix "$branch_prefix" --arg title "$candidate_title" \
                  --arg owner "$GITHUB_REPOSITORY_OWNER" '
                    [
                      .[]
                      | select(.isCrossRepository == false)
                      | select(((.headRepositoryOwner.login // "") | ascii_downcase) == ($owner | ascii_downcase))
                      | select(.state != "OPEN" and .title == $title)
                      | select(.headRefName | startswith($prefix))
                    ][0].number // empty
                  '
            )"
            if [[ -n "$previous_number" ]]; then
              echo "pr_action=none" >> "$GITHUB_OUTPUT"
              echo "upload_report=false" >> "$GITHUB_OUTPUT"
              echo "verify=false" >> "$GITHUB_OUTPUT"
              echo "$REGISTRY revision was already reviewed in PR #$previous_number; reopen it explicitly to reconsider."
              exit 0
            fi
            branch="${branch_prefix}${CANDIDATE_REVISION}"
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "pr_number=$existing_number" >> "$GITHUB_OUTPUT"

          remote_commit=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch:refs/remotes/origin/$branch"
            remote_commit="$(git rev-parse "refs/remotes/origin/$branch")"
            remote_tree="$(git show -s --format=%T "$remote_commit")"
            remote_parents="$(git show -s --format=%P "$remote_commit")"
            if [[ "$remote_tree" == "$candidate_tree" && "$remote_parents" == "$base_sha" ]]; then
              echo "pr_action=$([[ -n "$existing_number" ]] && echo none || echo create)" >> "$GITHUB_OUTPUT"
              echo "upload_report=$([[ -n "$existing_number" ]] && echo false || echo true)" >> "$GITHUB_OUTPUT"
              if [[ -n "$existing_number" ]]; then
                successful_checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$remote_commit/check-runs" \
                  --jq '[.check_runs[] | select(.name == "verify" and .conclusion == "success")] | length')"
                if [[ "$successful_checks" == "0" ]]; then
                  echo "verify=true" >> "$GITHUB_OUTPUT"
                else
                  echo "verify=false" >> "$GITHUB_OUTPUT"
                fi
                echo "$REGISTRY candidate is already open as PR #$existing_number; left its commit and review unchanged."
              else
                echo "verify=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          fi

          git switch -c "$branch"
          git commit -m "chore(registry): propose $REGISTRY ${CANDIDATE_REVISION:0:12}"
          if [[ -n "$remote_commit" ]]; then
            git push \
              --force-with-lease="refs/heads/$branch:$remote_commit" \
              origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          echo "pr_action=$([[ -n "$existing_number" ]] && echo update || echo create)" >> "$GITHUB_OUTPUT"
          echo "upload_report=true" >> "$GITHUB_OUTPUT"
          echo "verify=true" >> "$GITHUB_OUTPUT"
      - name: Upload full review report
        if: steps.candidate.outputs.upload_report == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-update-${{ matrix.registry }}-${{ matrix.candidate_revision }}
          path: ${{ runner.temp }}/registry-update-full.md
          if-no-files-found: error
          retention-days: 90
      - name: Create or update candidate PR
        if: steps.candidate.outputs.pr_action == 'create' || steps.candidate.outputs.pr_action == 'update'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
          PR_ACTION: ${{ steps.candidate.outputs.pr_action }}
          PR_NUMBER: ${{ steps.candidate.outputs.pr_number }}
          REGISTRY: ${{ matrix.registry }}
          CANDIDATE_REVISION: ${{ matrix.candidate_revision }}
        run: |
          title="chore(registry): review $REGISTRY ${CANDIDATE_REVISION:0:12}"
          if [[ "$PR_ACTION" == "create" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/registry-update.md"
          else
            gh pr edit "$PR_NUMBER" \
              --title "$title" \
              --body-file "$RUNNER_TEMP/registry-update.md"
          fi
      - name: Verify candidate
        if: steps.candidate.outputs.verify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.candidate.outputs.branch }}
        run: gh workflow run ci.yml --ref "$BRANCH"
