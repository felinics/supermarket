# Five Apps match the plugins in .claude-plugin/marketplace.json.
# That file is not read. skills/canvas-design is omitted from example-skills
# because its font files exceed the 5 MiB artifact limit.
# template/ is a placeholder and is not included.
# doc-coauthoring has no LICENSE.txt, so example-skills has no single license.
# document-skills is source-available under Anthropic's terms. The other Apps are Apache-2.0.
schema_version: "1"
id: anthropic
name: Anthropic
enabled: true
priority: 100
adapter:
  type: skill_pack
  apps:
    - id: document-skills
      version: "1.0.0"
      name: Document Skills
      description: Excel, Word, PowerPoint, and PDF skills.
      author:
        name: Anthropic
        email: support@anthropic.com
      homepage: https://github.com/anthropics/skills
      repository: https://github.com/anthropics/skills
      license: Proprietary
      category: documents
      tags:
        - documents
        - excel
        - word
        - powerpoint
        - pdf
      translations:
        zh:
          name: 文档处理
          description: Excel、Word、PowerPoint 和 PDF 的文档处理 Skill。
        ja:
          name: 文書処理
          description: Excel、Word、PowerPoint、PDF の文書処理 Skill。
      skills:
        - skills/xlsx
        - skills/docx
        - skills/pptx
        - skills/pdf
    - id: example-skills
      version: "1.0.0"
      name: Example Skills
      description: Example skills for skill authoring, MCP servers, visual design, algorithmic art, internal communications, web testing, artifacts, Slack GIFs, and themes.
      author:
        name: Anthropic
        email: support@anthropic.com
      homepage: https://github.com/anthropics/skills
      repository: https://github.com/anthropics/skills
      category: developer-tools
      tags:
        - design
        - mcp
        - testing
        - skills
      translations:
        zh:
          name: 示例 Skill
          description: 示例 Skill，包括 Skill 编写、MCP 服务、视觉设计、算法艺术、内部沟通、网页测试、HTML 作品、Slack GIF 和主题。
        ja:
          name: サンプル Skill
          description: サンプル Skill。Skill 作成、MCP サーバー、ビジュアルデザイン、アルゴリズムアート、社内連絡、Web テスト、アーティファクト、Slack GIF、テーマを含む。
      skills:
        - skills/algorithmic-art
        - skills/brand-guidelines
        - skills/doc-coauthoring
        - skills/frontend-design
        - skills/internal-comms
        - skills/mcp-builder
        - skills/skill-creator
        - skills/slack-gif-creator
        - skills/theme-factory
        - skills/web-artifacts-builder
        - skills/webapp-testing
    - id: claude-api
      version: "1.0.0"
      name: Claude API
      description: Claude API and SDK reference for building applications that call a large language model.
      author:
        name: Anthropic
        email: support@anthropic.com
      homepage: https://github.com/anthropics/skills
      repository: https://github.com/anthropics/skills
      license: Apache-2.0
      category: developer-tools
      tags:
        - claude
        - api
        - sdk
      translations:
        zh:
          name: Claude API
          description: 用于开发大语言模型应用的 Claude API 与 SDK 参考。
        ja:
          name: Claude API
          description: 大規模言語モデルを呼び出すアプリケーション向けの Claude API と SDK のリファレンス。
      skills:
        - skills/claude-api
    - id: academy-guide
      version: "1.0.0"
      name: Academy Guide
      description: Recommends Claude Academy courses and tutorials when someone asks how to use Claude.
      author:
        name: Anthropic
        email: support@anthropic.com
      homepage: https://github.com/anthropics/skills
      repository: https://github.com/anthropics/skills
      license: Apache-2.0
      category: education-research
      tags:
        - claude
        - learning
      translations:
        zh:
          name: Academy 指南
          description: 在用户询问如何使用 Claude 时，推荐 Claude Academy 的课程和教程。
        ja:
          name: Academy ガイド
          description: Claude の使い方を尋ねられたとき、Claude Academy のコースとチュートリアルを勧める。
      skills:
        - skills/academy-guide
    - id: discernment-nudge
      version: "1.0.0"
      name: Discernment Nudge
      description: After a substantive answer, adds a few short questions so the user can check facts, reasoning, and missing context.
      author:
        name: Anthropic
        email: support@anthropic.com
      homepage: https://github.com/anthropics/skills
      repository: https://github.com/anthropics/skills
      license: Apache-2.0
      category: other
      tags:
        - review
      translations:
        zh:
          name: Discernment Nudge
          description: 在实质性回答之后附加几个简短问题，便于用户核对事实、推理和缺失的上下文。
        ja:
          name: 判断の確認
          description: 実質的な回答の後に短い質問を添え、事実、推論、不足している文脈を確認できるようにする。
      skills:
        - skills/discernment-nudge
source:
