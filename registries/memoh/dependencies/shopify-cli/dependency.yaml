schema_version: "1"
id: shopify-cli
name: Shopify CLI
description: Develop and deploy Shopify apps and themes from the command line.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - node
provides:
  - shopify
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Develop and deploy Shopify apps and themes from the command line.
  zh:
    description: 在命令行开发和部署 Shopify 应用与主题。
  ja:
    description: コマンドラインで Shopify アプリとテーマを開発・デプロイします。
