schema_version: "1"
id: wrangler
name: Wrangler
description: Develop and deploy Cloudflare Workers and manage their resources.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - node
provides:
  - wrangler
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Develop and deploy Cloudflare Workers and manage their resources.
  zh:
    description: 开发和部署 Cloudflare Workers，管理相关资源。
  ja:
    description: Cloudflare Workers の開発・デプロイと関連リソースの管理を行います。
