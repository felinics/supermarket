schema_version: "1"
id: go
name: Go
description: Go installed in an isolated, versioned workspace directory.
category: runtime
source: managed
requires:
  - python
provides:
  - go
  - gofmt
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Go tools
  zh:
    description: Go 编译、测试与格式化
  ja:
    description: Go のビルド・テスト・フォーマット
