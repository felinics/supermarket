schema_version: "1"
id: document-python
name: Document Python
description: Python libraries for reading, creating and converting documents,
  spreadsheets, PDFs and images.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - uv
provides:
  - document-python
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Python libraries for reading, creating and converting documents,
      spreadsheets, PDFs and images.
  zh:
    description: 用于读取、生成和转换文档、电子表格、PDF 及图片的 Python 库。
  ja:
    description: 文書・スプレッドシート・PDF・画像の読み込み、生成、変換に使う Python ライブラリです。
