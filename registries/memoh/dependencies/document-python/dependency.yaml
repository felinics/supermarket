schema_version: "1"
id: document-python
name: Document Python
description: Document Python installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - uv
provides:
  - document-python
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Document Python tools
  zh:
    description: 文档处理 Python 环境
  ja:
    description: 文書処理 Python 環境
