schema_version: "1"
id: tesseract
name: Tesseract OCR
description: Extract text from images with the Tesseract OCR engine.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - tesseract
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Extract text from images with the Tesseract OCR engine.
  zh:
    description: 使用 Tesseract OCR 引擎从图片中识别和提取文本。
  ja:
    description: Tesseract OCR エンジンで画像から文字を認識・抽出します。
