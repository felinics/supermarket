schema_version: "1"
id: tesseract
name: Tesseract OCR
description: Tesseract OCR installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - tesseract
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Tesseract OCR tools
  zh:
    description: Tesseract OCR 工具及运行库
  ja:
    description: Tesseract OCR ツールとランタイム
