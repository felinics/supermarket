schema_version: "1"
# Google's releases page (https://antigravity.google/releases) links to
# google-antigravity/antigravity-cli. Use its versioned native assets and
# GitHub's SHA256 asset digests for both latest and exact-version installs.
id: antigravity
name: Google Antigravity
category: agent
icon: icon.svg
description: Google Antigravity CLI (agy).

source: managed
provides:
  - agy

platforms:
  - { os: linux, arch: [amd64, arm64], libc: glibc }
  - { os: linux, arch: [amd64, arm64], libc: musl }
  - { os: darwin, arch: [amd64, arm64] }

# No version.pin: install the latest stable release by default, or an exact
# version on request. Memoh owns updates and rollback; the agy launcher
# disables the native background updater and rejects native install/update.
timeouts:
  install: 1200
  update: 1200
  remove: 300
  check_update: 60
  version: 30

scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh

translations:
  en:
    description: "Google Antigravity command line (agy)"
  zh:
    description: "Google Antigravity 命令行（agy）"
  ja:
    description: "Google Antigravity コマンドライン（agy）"
