schema_version: "1"
id: stripe-cli
name: Stripe CLI
description: Call Stripe APIs, forward webhooks and test payment integrations.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - stripe
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Call Stripe APIs, forward webhooks and test payment integrations.
  zh:
    description: 调用 Stripe API、转发 Webhook 并测试支付集成。
  ja:
    description: Stripe API の呼び出し、Webhook の転送、決済連携のテストを行います。
