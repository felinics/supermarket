schema_version: "1"
id: sentry
name: Sentry
description: Inspect Sentry errors and project data from the command line.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - sentry
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Inspect Sentry errors and project data from the command line.
  zh:
    description: 在命令行查看 Sentry 错误和项目数据。
  ja:
    description: コマンドラインで Sentry のエラーとプロジェクトデータを確認します。
