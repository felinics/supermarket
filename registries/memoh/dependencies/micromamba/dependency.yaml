schema_version: "1"
id: micromamba
name: Micromamba
description: Create isolated Conda environments and install native tools and libraries.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - micromamba
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Create isolated Conda environments and install native tools and libraries.
  zh:
    description: 创建隔离的 Conda 环境，安装原生工具和库。
  ja:
    description: 独立した Conda 環境を作成し、ネイティブツールとライブラリをインストールします。
