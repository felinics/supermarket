schema_version: "1"
# xAI publishes Grok Build as one self-contained binary per platform. The
# scripts read them from where the official installer
# (https://x.ai/cli/install.sh) does: <base>/stable names the newest stable
# release and <base>/grok-<version>-<os>-<arch>[.gz] is the binary. xAI
# publishes no checksum, so the base is fixed to x.ai and its own storage
# bucket rather than left to a mirror variable.
#
# The npm package @xai-official/grok is deliberately not used: its launcher
# unpacks the binary into $GROK_HOME/bin at run time, and Memoh gives every
# Agent its own GROK_HOME.
id: grok
name: Grok Build
category: agent
icon: icon.svg
description: xAI Grok Build CLI.

source: managed
provides:
  - grok

# The Linux binaries are statically linked, so no libc is required.
platforms:
  - { os: linux, arch: [amd64, arm64] }
  - { os: darwin, arch: [arm64] }

# No version.pin: like every managed dependency the newest stable release
# installs by default, a specific version can be requested, check_update
# compares against the stable channel, and rollback returns to the previous
# version.

timeouts:
  install: 1200
  remove: 300
  check_update: 60
  version: 30

scripts:
  install: install.sh
  update: update.sh
  remove: remove.sh
  check_update: check-update.sh

translations:
  en:
    description: "xAI Grok Build command line"
  zh:
    description: "xAI Grok Build 命令行"
  ja:
    description: "xAI Grok Build コマンドライン"
