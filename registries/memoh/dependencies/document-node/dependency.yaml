schema_version: "1"
id: document-node
name: Document JavaScript
description: Document JavaScript installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - node
provides:
  - document-node
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Document JavaScript tools
  zh:
    description: 文档生成 JavaScript 库
  ja:
    description: 文書生成 JavaScript ライブラリ
