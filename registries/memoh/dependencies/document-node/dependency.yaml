schema_version: "1"
id: document-node
name: Document JavaScript
description: JavaScript libraries for creating Word, PowerPoint and PDF files
  and processing images.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - node
provides:
  - document-node
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: JavaScript libraries for creating Word, PowerPoint and PDF files
      and processing images.
  zh:
    description: 用于生成 Word、PowerPoint、PDF 和处理图片的 JavaScript 库。
  ja:
    description: Word・PowerPoint・PDF の生成と画像処理に使う JavaScript ライブラリです。
