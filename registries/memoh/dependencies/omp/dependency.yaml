schema_version: "1"
# Use the standalone binaries and SHA256 metadata from OMP's official
# build service, as scripts/install.sh in can1357/oh-my-pi does. Bun and
# the native modules are embedded; no global package install is needed.
id: omp
name: Oh My Pi (OMP)
category: agent
icon: icon.svg
description: Oh My Pi coding agent CLI.

source: managed
provides:
  - omp

# The Linux build requires glibc. Do not select the musl builds without
# also providing their libstdc++ and libgcc runtime dependencies.
platforms:
  - { os: linux, arch: [amd64, arm64], libc: glibc }
  - { os: darwin, arch: [amd64, arm64] }

# Install the latest stable build by default, or an exact requested release.
# Previous versions remain available for Memoh's rollback operation.
timeouts:
  install: 1200
  update: 1200
  remove: 300
  check_update: 60
  version: 30

scripts:
  install: install.sh
  update: update.sh
  remove: remove.sh
  check_update: check-update.sh

translations:
  en:
    description: Oh My Pi coding agent command line
  zh:
    description: Oh My Pi 编程智能体命令行
  ja:
    description: Oh My Pi コーディングエージェントのコマンドライン
