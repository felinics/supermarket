schema_version: "1"
id: git
name: Git
description: Git installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - git
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Git tools
  zh:
    description: Git 工具及运行库
  ja:
    description: Git ツールとランタイム
