schema_version: "1"
id: git
name: Git
description: Track changes, manage branches and synchronize Git repositories.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - git
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Track changes, manage branches and synchronize Git repositories.
  zh:
    description: 跟踪代码变更、管理分支并同步 Git 仓库。
  ja:
    description: 変更履歴の追跡、ブランチ管理、Git リポジトリの同期を行います。
