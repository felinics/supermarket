schema_version: "1"
id: bun
name: Bun
description: Run JavaScript and TypeScript, install packages, bundle code and execute tests.
icon: icon.svg
category: runtime
source: managed
requires:
  - python
provides:
  - bun
  - bunx
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Run JavaScript and TypeScript, install packages, bundle code and
      execute tests.
  zh:
    description: 运行 JavaScript 和 TypeScript，安装依赖、打包代码和执行测试。
  ja:
    description: JavaScript・TypeScript の実行、パッケージ管理、バンドル、テストに対応します。
