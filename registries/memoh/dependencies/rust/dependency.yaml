schema_version: "1"
id: rust
name: Rust
description: Build and test Rust projects with Cargo, format code and run Clippy checks.
icon: icon.svg
category: runtime
source: managed
requires:
  - python
  - native-build-tools
provides:
  - rustup
  - rustc
  - cargo
  - rustfmt
  - cargo-fmt
  - clippy-driver
  - cargo-clippy
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Build and test Rust projects with Cargo, format code and run Clippy checks.
  zh:
    description: 使用 Cargo 构建和测试 Rust 项目，格式化代码并运行 Clippy 检查。
  ja:
    description: Cargo で Rust プロジェクトをビルド・テストし、コード整形と Clippy の検査を行います。
