schema_version: "1"
id: ffmpeg
name: FFmpeg
description: Convert, edit and inspect audio and video with FFmpeg and ffprobe.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - ffmpeg
  - ffprobe
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
