    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Convert, edit and inspect audio and video with FFmpeg and ffprobe.
  zh:
    description: 使用 FFmpeg 和 ffprobe 转换、编辑和检查音视频。
  ja:
    description: FFmpeg と ffprobe で音声・動画を変換、編集、解析します。
