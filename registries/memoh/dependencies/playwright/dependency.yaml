schema_version: "1"
id: playwright
name: Playwright
description: Playwright installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - node
provides:
  - playwright
  - playwright-cli
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Playwright tools
  zh:
    description: 浏览器自动化和测试环境
  ja:
    description: ブラウザー自動化とテスト環境
