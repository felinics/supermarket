schema_version: "1"
id: gitlab-cli
name: GitLab CLI
description: Manage GitLab projects, issues, merge requests and pipelines with glab.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - glab
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Manage GitLab projects, issues, merge requests and pipelines with glab.
  zh:
    description: 使用 glab 管理 GitLab 项目、Issue、合并请求和流水线。
  ja:
    description: glab で GitLab プロジェクト、Issue、マージリクエスト、パイプラインを管理します。
