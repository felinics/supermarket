schema_version: "1"
id: github-cli
name: GitHub CLI
description: Manage GitHub repositories, issues, pull requests and workflow runs with gh.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - gh
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Manage GitHub repositories, issues, pull requests and workflow runs
      with gh.
  zh:
    description: 使用 gh 管理 GitHub 仓库、Issue、PR 和工作流运行。
  ja:
    description: gh で GitHub リポジトリ、Issue、PR、ワークフロー実行を管理します。
