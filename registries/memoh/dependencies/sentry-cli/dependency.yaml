schema_version: "1"
id: sentry-cli
name: Sentry Release CLI
description: Manage Sentry releases and upload source maps and debug symbols.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - sentry-cli
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Manage Sentry releases and upload source maps and debug symbols.
  zh:
    description: 管理 Sentry 发布版本，上传 source map 和调试符号。
  ja:
    description: Sentry のリリースを管理し、ソースマップとデバッグシンボルをアップロードします。
