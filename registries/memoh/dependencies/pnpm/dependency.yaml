schema_version: "1"
id: pnpm
name: pnpm
description: Install and manage JavaScript packages and monorepo workspaces with pnpm.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - node
provides:
  - pnpm
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Install and manage JavaScript packages and monorepo workspaces with pnpm.
  zh:
    description: 使用 pnpm 安装和管理 JavaScript 包及 monorepo 工作区。
  ja:
    description: pnpm で JavaScript パッケージとモノレポのワークスペースを管理します。
