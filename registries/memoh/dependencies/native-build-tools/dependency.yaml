schema_version: "1"
id: native-build-tools
name: Native Build Tools
description: Compile C and C++ code with compilers, Make, CMake and pkg-config.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - cc
  - gcc
  - c++
  - g++
  - make
  - cmake
  - pkg-config
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Compile C and C++ code with compilers, Make, CMake and pkg-config.
  zh:
    description: 提供 C/C++ 编译器、Make、CMake 和 pkg-config，用于原生代码构建。
  ja:
    description: C/C++ コンパイラ、Make、CMake、pkg-config でネイティブコードをビルドします。
