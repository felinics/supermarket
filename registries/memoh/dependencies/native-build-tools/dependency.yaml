schema_version: "1"
id: native-build-tools
name: Native Build Tools
description: Native Build Tools installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - cc
  - gcc
  - c++
  - g++
  - make
  - cmake
  - pkg-config
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Native Build Tools tools
  zh:
    description: 原生编译器与构建工具
  ja:
    description: ネイティブコンパイラとビルドツール
