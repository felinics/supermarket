schema_version: "1"
id: supabase-cli
name: Supabase CLI
description: Manage Supabase projects, database migrations and Edge Functions.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - supabase
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Manage Supabase projects, database migrations and Edge Functions.
  zh:
    description: 管理 Supabase 项目、数据库迁移和 Edge Functions。
  ja:
    description: Supabase プロジェクト、データベース移行、Edge Functions を管理します。
