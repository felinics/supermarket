schema_version: "1"
id: libreoffice
name: LibreOffice
description: LibreOffice installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
provides:
  - soffice
  - libreoffice
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: LibreOffice tools
  zh:
    description: Office 文档转换与公式重算
  ja:
    description: Office 文書変換と数式再計算
