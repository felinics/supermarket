schema_version: "1"
id: libreoffice
name: LibreOffice
description: Convert Office documents and recalculate spreadsheet formulas with LibreOffice.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - soffice
  - libreoffice
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Convert Office documents and recalculate spreadsheet formulas with
      LibreOffice.
  zh:
    description: 使用 LibreOffice 转换 Office 文档并重新计算电子表格公式。
  ja:
    description: LibreOffice で Office 文書を変換し、スプレッドシートの数式を再計算します。
