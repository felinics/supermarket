schema_version: "1"
id: postman-cli
name: Postman CLI
description: Run Postman API collections and tests from the command line.
icon: icon.svg
category: tool
source: managed
requires:
  - python
provides:
  - postman
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Run Postman API collections and tests from the command line.
  zh:
    description: 在命令行运行 Postman API 集合和测试。
  ja:
    description: コマンドラインで Postman の API コレクションとテストを実行します。
