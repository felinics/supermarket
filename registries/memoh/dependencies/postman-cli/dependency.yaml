schema_version: "1"
id: postman-cli
name: Postman CLI
description: Postman CLI installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
provides:
  - postman
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Postman CLI tools
  zh:
    description: Postman 接口测试工具
  ja:
    description: Postman API テストツール
