schema_version: "1"
id: apify-cli
name: Apify CLI
description: Develop, run and deploy Apify Actors from the command line.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - node
provides:
  - apify
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Develop, run and deploy Apify Actors from the command line.
  zh:
    description: 在命令行开发、运行和部署 Apify Actor。
  ja:
    description: コマンドラインで Apify Actor を開発・実行・デプロイします。
