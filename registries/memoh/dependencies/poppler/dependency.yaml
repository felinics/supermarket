schema_version: "1"
id: poppler
name: Poppler
description: Inspect PDFs, extract text and render pages as images with Poppler utilities.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - pdftotext
  - pdftoppm
  - pdfinfo
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Inspect PDFs, extract text and render pages as images with Poppler
      utilities.
  zh:
    description: 使用 Poppler 工具检查 PDF、提取文本并将页面渲染为图片。
  ja:
    description: Poppler ツールで PDF を解析し、テキスト抽出とページの画像化を行います。
