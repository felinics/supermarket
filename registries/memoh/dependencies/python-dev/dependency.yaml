schema_version: "1"
id: python-dev
name: Python Development
description: Lint and format Python code with Ruff and run tests with pytest.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - uv
provides:
  - ruff
  - pytest
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Lint and format Python code with Ruff and run tests with pytest.
  zh:
    description: 使用 Ruff 检查和格式化 Python 代码，使用 pytest 运行测试。
  ja:
    description: Ruff で Python コードを検査・整形し、pytest でテストを実行します。
