schema_version: "1"
id: python-dev
name: Python Development
description: Python Development installed in an isolated, versioned workspace directory.
category: tool
source: managed
requires:
  - python
  - uv
provides:
  - ruff
  - pytest
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
translations:
  en:
    description: Python Development tools
  zh:
    description: Python 代码检查和测试
  ja:
    description: Python のコード検査とテスト
