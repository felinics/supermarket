schema_version: "1"
id: pandoc
name: Pandoc
description: Convert documents between Markdown, HTML, Word, LaTeX and other formats.
icon: icon.svg
category: tool
source: managed
requires:
  - python
  - micromamba
provides:
  - pandoc
platforms:
  - os: linux
    arch:
      - amd64
      - arm64
    libc: glibc
  - os: darwin
    arch:
      - arm64
timeouts:
  install: 3600
  update: 3600
  remove: 300
  check_update: 300
  version: 60
scripts:
  install: install.sh
  update: install.sh
  remove: remove.sh
  check_update: check-update.sh
  version: version.sh
translations:
  en:
    description: Convert documents between Markdown, HTML, Word, LaTeX and other formats.
  zh:
    description: 在 Markdown、HTML、Word、LaTeX 等文档格式之间转换。
  ja:
    description: Markdown・HTML・Word・LaTeX などの文書形式を相互変換します。
